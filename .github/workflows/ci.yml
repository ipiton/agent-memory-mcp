name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v ./cmd/agent-memory-mcp

      # `make vet` also vets the build-tagged packages. Plain `go vet ./...`
      # skips them, which is how the eval harness stayed broken for four
      # months without a single red build (T112).
      - name: Vet
        run: make vet

      - name: Test
        run: go test -v -race ./...

      # The retrieval eval is the acceptance instrument for reranker and
      # ranking work; it only counts if it runs.
      - name: Retrieval eval
        run: make eval

      # T117: `goreleaser check` exits non-zero on a deprecated key, and one is
      # deprecated on purpose (see the note at `brews:` in .goreleaser.yaml), so
      # a plain check step could only ever be red. Gate on the *set* of
      # deprecations instead: the known one passes, a new one fails. Without
      # this the next deprecation is found the way this one was — by accident,
      # while preparing an unrelated task.
      - name: Release config deprecations
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
        continue-on-error: true
      - name: Fail on an unexpected release-config deprecation
        run: ./scripts/check-goreleaser-deprecations.sh
