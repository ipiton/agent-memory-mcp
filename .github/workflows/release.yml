name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # T160: первый запуск опубликованного архива, а не собранного из исходников.
  # Красная джоба не отменяет релиз и формулу в тапе, но не пускает его в реестр.
  smoke-published:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download the published archive and verify its checksum
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          mkdir published
          gh release download "$GITHUB_REF_NAME" --dir published \
            --pattern "agent-memory-mcp-*-$OS-$ARCH.tar.gz" --pattern '*_checksums.txt'
          (cd published && grep -- "-$OS-$ARCH.tar.gz" ./*_checksums.txt | shasum -a 256 -c -)
        env:
          GH_TOKEN: ${{ github.token }}

      - name: First run of the archive
        run: ./scripts/release-smoke.sh published/agent-memory-mcp-*.tar.gz

  # Публикация записи в официальном MCP-реестре (registry.modelcontextprotocol.io).
  # Namespace io.github.ipiton/* подтверждается через GitHub OIDC — секреты не нужны.
  publish-registry:
    needs: smoke-published
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version with tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      # Validate before login, not after: `publish` validates too, but by then
      # the job has already authenticated and a malformed server.json fails
      # halfway through a release instead of before it starts (T107 item 4).
      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
