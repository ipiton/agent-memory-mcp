version: 2

project_name: agent-memory-mcp

builds:
  - main: ./cmd/agent-memory-mcp
    binary: agent-memory-mcp
    ldflags:
      - -s -w -X github.com/ipiton/agent-memory-mcp/internal/server.Version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - name: agent-memory-mcp
    repository:
      owner: ipiton
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ipiton/agent-memory-mcp"
    description: "MCP server with persistent agent memory and RAG semantic search"
    license: "MIT"
    install: |
      bin.install "agent-memory-mcp"
      # T101: the service is launched through a wrapper so secrets can come
      # from SOPS on machines that use it, without forcing sops on anyone
      # else. No secrets file → the wrapper execs the binary directly, which
      # is exactly what the service did before.
      (libexec/"service-wrapper").write <<~SH
        #!/bin/bash
        set -euo pipefail

        BIN="#{opt_bin}/agent-memory-mcp"
        CONFIG="#{etc}/agent-memory-mcp/config.env"
        SECRETS="#{etc}/agent-memory-mcp/secrets.sops.env"

        if [ -f "$SECRETS" ] && command -v sops >/dev/null 2>&1; then
          # launchd gives a minimal environment, so the age key has to be named
          # explicitly — sops does not find it otherwise (verified 2026-08-14).
          : "${SOPS_AGE_KEY_FILE:=$HOME/.config/sops/age/keys.txt}"
          export SOPS_AGE_KEY_FILE
          # --same-process makes sops exec the service in place instead of
          # forking it. Without it launchd would supervise sops rather than the
          # service, and `brew services stop` would change meaning.
          exec sops exec-env --same-process "$SECRETS" "$BIN serve --config $CONFIG"
        fi

        exec "$BIN" serve --config "$CONFIG"
      SH
      chmod 0755, libexec/"service-wrapper"
    post_install: |
      (etc/"agent-memory-mcp").mkpath
      config_file = etc/"agent-memory-mcp/config.env"
      unless config_file.exist?
        config_file.write <<~EOS
          # agent-memory-mcp service configuration
          # Edit this file and the service will auto-reload within ~30 seconds.
          # Or send SIGHUP: kill -HUP $(pgrep agent-memory-mcp)

          # HTTP daemon mode (required for brew services)
          MCP_HTTP_MODE=http
          MCP_HTTP_HOST=127.0.0.1
          MCP_HTTP_PORT=18080

          # Data storage
          MCP_DATA_PATH=#{var}/agent-memory-mcp
          MCP_MEMORY_DB_PATH=#{var}/agent-memory-mcp/memory-store/memories.db
          MCP_RAG_INDEX_PATH=#{var}/agent-memory-mcp/rag-index
          MCP_LOG_PATH=#{var}/log/agent-memory-mcp/mcp-diagnostics.log

          # Memory (enabled by default)
          MCP_MEMORY_ENABLED=true

          # RAG document search (disabled by default — enable after setting MCP_ROOT)
          MCP_RAG_ENABLED=false
          # MCP_ROOT=/path/to/your/project
          # MCP_INDEX_DIRS=docs,README.md,CHANGELOG.md

          # Embeddings
          MCP_EMBEDDING_MODE=auto
          OLLAMA_BASE_URL=http://localhost:11434
          # JINA_API_KEY=
          # OPENAI_API_KEY=
        EOS
      end
      (var/"agent-memory-mcp/memory-store").mkpath
      (var/"agent-memory-mcp/rag-index").mkpath
      (var/"log/agent-memory-mcp").mkpath
    service: |
      run [opt_libexec/"service-wrapper"]
      keep_alive true
      log_path var/"log/agent-memory-mcp/service.log"
      error_log_path var/"log/agent-memory-mcp/service.err.log"
      working_dir var/"agent-memory-mcp"
    caveats: |
      Run once to configure Claude Code auto-capture:
        agent-memory-mcp setup

      To start the background service:
        brew services start agent-memory-mcp

      Config: #{etc}/agent-memory-mcp/config.env
      Data:   #{var}/agent-memory-mcp/
      Logs:   #{var}/log/agent-memory-mcp/
    test: |
      assert_match version.to_s, shell_output("#{bin}/agent-memory-mcp 2>&1", 1)

homebrew_casks:
  - name: agent-memory-mcp
    binaries:
      - agent-memory-mcp
    repository:
      owner: ipiton
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ipiton/agent-memory-mcp"
    description: "MCP server with persistent agent memory and RAG semantic search"
